<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Names Custom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
        }
        canvas {
            touch-action: none;
        }
        /* Mode Layar Penuh Kustom dengan flex agar roda lebih besar dan modal pop-up tetap berada di atasnya */
        .fullscreen-mode {
            position: fixed !important;
            inset: 0 !important;
            z-index: 50 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            border-radius: 0 !important;
            background: #ffffff !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
        }
        /* Memperbesar ukuran roda saat dalam mode layar penuh */
        .fullscreen-mode .wheel-wrapper {
            width: 84vh !important;
            height: 84vh !important;
            max-width: 94vw !important;
            max-height: 94vw !important;
        }
        .fullscreen-mode #center-spin-btn {
            width: 6.5rem !important;
            height: 6.5rem !important;
        }
        .fullscreen-mode #center-spin-btn span {
            font-size: 1rem !important;
        }
        /* Efek zoom-in saat kursor diarahkan ke roda yang sedang berputar (mode layar penuh) */
        .fullscreen-mode .wheel-wrapper.is-spinning:hover {
            transform: scale(1.07);
        }
        .fullscreen-mode .wheel-wrapper.is-spinning {
            cursor: zoom-in;
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen">

    <header class="bg-white shadow-sm py-3 px-6 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold text-lg">W</div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">Wheel of Names Custom</h1>
        </div>
        <div class="flex items-center gap-3">
            <button id="settings-toggle-btn" class="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors flex items-center gap-1.5">
                <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 11-6 0 3 3 0 016 0z"></path></svg>
                Pengaturan Putar
            </button>
            <div class="text-sm text-slate-500 font-medium hidden sm:block">Interactive Spin Wheel</div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 items-center">
        
        <!-- Kolom Roda Utama (Area luar putih untuk kelompok bawah) -->
        <div id="outer-wheel-container" class="lg:col-span-2 flex flex-col items-center justify-center bg-white/80 backdrop-blur-md p-6 rounded-2xl shadow-lg border border-slate-100 relative cursor-pointer group min-h-[480px]">
            
            <!-- Tombol Fullscreen di Sudut Kanan Atas Kontainer Roda -->
            <button id="fullscreen-btn" title="Layar Penuh" class="absolute top-4 right-4 z-30 bg-white/90 hover:bg-white text-slate-700 hover:text-indigo-600 p-2.5 rounded-xl shadow-md border border-slate-200 transition-all flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
            </button>

            <!-- Roda Wrapper dengan Pointer (Area dalam untuk kelompok atas) -->
            <div class="wheel-wrapper relative w-[340px] h-[340px] sm:w-[420px] sm:h-[420px] my-6 transition-all duration-300">
                <!-- Pointer Penunjuk Kanan -->
                <div class="absolute -right-4 top-1/2 -translate-y-1/2 z-20 w-0 h-0 border-t-[16px] border-t-transparent border-b-[16px] border-b-transparent border-r-[28px] border-r-red-500 filter drop-shadow-md pointer-events-none"></div>
                
                <!-- Canvas Roda Tergabung -->
                <canvas id="wheelCanvas" width="500" height="500" class="w-full h-full rounded-full shadow-2xl border-4 border-white cursor-pointer transition-transform duration-700"></canvas>
                
                <!-- Tombol Tengah Roda -->
                <div id="center-spin-btn" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 bg-white rounded-full shadow-lg border-4 border-indigo-600 flex items-center justify-center cursor-pointer hover:scale-105 active:scale-95 transition-all z-10 group-hover:border-violet-600">
                    <span class="text-xs font-extrabold uppercase tracking-wider text-indigo-600 text-center leading-tight">PUTAR<br>RODA</span>
                </div>
            </div>
        </div>

        <!-- Kolom Pengisian Daftar Nama -->
        <div class="bg-white p-5 rounded-2xl shadow-lg border border-slate-100 flex flex-col h-[520px]">
            <div class="flex items-center justify-between mb-3">
                <h2 class="font-bold text-slate-800 text-base flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    Daftar Nama (<span id="total-names-count">0</span>)
                </h2>
                <div class="flex gap-1.5">
                    <button id="shuffle-btn" class="px-2.5 py-1 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors">Acak</button>
                    <button id="sort-btn" class="px-2.5 py-1 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors">Urutkan</button>
                </div>
            </div>

            <textarea id="names-input" class="w-full flex-1 p-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none font-medium leading-relaxed" placeholder="Ali&#10;Beatriz&#10;Charles&#10; Diya&#10;Eric&#10;Fatimah"></textarea>
            <p class="text-[11px] text-slate-400 mt-1.5 leading-snug">Tips: beri satu spasi di awal baris pertama nama kelompok bawah untuk memisahkannya dari kelompok atas.</p>

            <div class="mt-3 flex gap-2">
                <button id="save-names-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm shadow-md transition-all">Perbarui Roda</button>
            </div>
        </div>

    </main>

    <!-- Kontainer Notifikasi Toast -->
    <div id="toast-container" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[300] flex flex-col items-center gap-2 pointer-events-none"></div>

    <!-- Modal Pengaturan -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="settings-modal-content" class="bg-white rounded-3xl shadow-2xl p-6 max-w-sm w-full mx-4 transform scale-90 transition-transform duration-300">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-slate-800 text-lg">Pengaturan Putaran Roda</h3>
                <button id="close-settings-btn" class="text-slate-400 hover:text-slate-600 p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Durasi Putaran</label>
                    <select id="spin-duration-select" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm bg-white font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="15">15 Detik</option>
                        <option value="30" selected>30 Detik</option>
                        <option value="60">60 Detik</option>
                        <option value="90">90 Detik</option>
                        <option value="120">120 Detik</option>
                        <option value="300">300 Detik (5 Menit)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Kecepatan Putaran Maksimal</label>
                    <select id="spin-speed-select" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm bg-white font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="3" selected>3 Putaran</option>
                        <option value="lambat">Lambat (2 Putaran)</option>
                        <option value="sedang">Sedang (6 Putaran)</option>
                        <option value="cepat">Cepat (12 Putaran)</option>
                    </select>
                </div>
            </div>

            <div class="mt-6">
                <button id="save-settings-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm shadow-md transition-all">Simpan Pengaturan</button>
            </div>
        </div>
    </div>

    <!-- Modal Pemenang (Z-index lebih tinggi agar tampil di atas fullscreen container) -->
    <div id="winner-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="winner-modal-content" class="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full mx-4 text-center transform scale-90 transition-transform duration-300">
            <div class="w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">🏆</div>
            <h3 class="text-sm font-medium text-slate-400 uppercase tracking-widest mb-1">Selamat Kepada</h3>
            <h2 id="winner-name-display" class="text-3xl font-extrabold text-slate-800 mb-6 break-words">Nama Pemenang</h2>
            
            <div class="flex flex-col gap-2.5">
                <button id="remove-winner-btn" class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-3 rounded-xl text-sm shadow-md transition-all flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    Hapus Nama dari Roda
                </button>
                <button id="keep-winner-btn" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl text-sm transition-all">
                    Biarkan di Roda & Tutup
                </button>
            </div>
        </div>
    </div>

    <script>
        let topGroupNames = ["Ali", "Beatriz", "Charles"];
        let bottomGroupNames = ["Diya", "Eric", "Fatimah"];
        
        let currentNames = []; 
        let isSpinning = false;
        let currentAngle = 0;
        let lastWinner = "";

        let settings = {
            duration: 30, // Default 30 seconds
            rotations: 3   // Default 3 rotations
        };

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const namesInput = document.getElementById('names-input');
        const totalNamesCount = document.getElementById('total-names-count');
        const outerWheelContainer = document.getElementById('outer-wheel-container');
        const centerSpinBtn = document.getElementById('center-spin-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const wheelWrapper = document.querySelector('.wheel-wrapper');

        let audioCtx = null;
        function playTickSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
                
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {
                // Ignore audio restriction errors
            }
        }

        function playWinSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const now = audioCtx.currentTime;
                // Fanfare ceria: do-mi-sol-do (oktaf atas)
                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((freq, i) => {
                    const startTime = now + i * 0.11;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0, startTime);
                    gain.gain.linearRampToValueAtTime(0.2, startTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.4);
                });
                // Kerlip nada tinggi di akhir sebagai sentuhan "yeay"
                const sparkleStart = now + notes.length * 0.11;
                const sparkle = audioCtx.createOscillator();
                const sparkleGain = audioCtx.createGain();
                sparkle.type = 'sine';
                sparkle.frequency.setValueAtTime(1568, sparkleStart);
                sparkleGain.gain.setValueAtTime(0, sparkleStart);
                sparkleGain.gain.linearRampToValueAtTime(0.14, sparkleStart + 0.02);
                sparkleGain.gain.exponentialRampToValueAtTime(0.001, sparkleStart + 0.5);
                sparkle.connect(sparkleGain);
                sparkleGain.connect(audioCtx.destination);
                sparkle.start(sparkleStart);
                sparkle.stop(sparkleStart + 0.55);
            } catch (e) {
                // Abaikan jika audio dibatasi browser
            }
        }

        const wheelColors = [
            '#f87171', '#fb923c', '#fbbf24', '#34d399', 
            '#38bdf8', '#818cf8', '#c084fc', '#f472b6',
            '#4ade80', '#22d3ee', '#a78bfa', '#fb7185'
        ];

        // Bantuan modulo yang selalu mengembalikan nilai positif
        function mod(n, m) {
            return ((n % m) + m) % m;
        }

        let toastTimeoutId = null;
        function toast(message) {
            const container = document.getElementById('toast-container');
            container.innerHTML = '';
            const el = document.createElement('div');
            el.className = 'pointer-events-auto bg-slate-800 text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow-lg opacity-0 transition-opacity duration-200';
            el.innerText = message;
            container.appendChild(el);
            requestAnimationFrame(() => el.classList.remove('opacity-0'));
            clearTimeout(toastTimeoutId);
            toastTimeoutId = setTimeout(() => {
                el.classList.add('opacity-0');
                setTimeout(() => el.remove(), 200);
            }, 2600);
        }

        function isListEmpty() {
            return currentNames.length === 0 ||
                (currentNames.length === 1 && currentNames[0] === "(Kosong)");
        }

        function parseNamesInput() {
            const rawText = namesInput.value;
            const rawLines = rawText.split('\n');
            
            topGroupNames = [];
            bottomGroupNames = [];
            let currentTarget = topGroupNames;

            for (let line of rawLines) {
                // Tanda spasi satu di depan sebagai penanda pembatas kelompok
                if (line.startsWith(' ')) {
                    currentTarget = bottomGroupNames;
                }
                
                const trimmed = line.trim();
                if (trimmed === '') continue;

                currentTarget.push(trimmed);
            }

            if (topGroupNames.length === 0 && bottomGroupNames.length === 0) {
                topGroupNames = ["(Kosong)"];
            }

            updateWheelData();
        }

        function updateWheelData() {
            currentNames = [...topGroupNames, ...bottomGroupNames];
            totalNamesCount.innerText = isListEmpty() ? 0 : currentNames.length;
            resizeCanvas();
        }

        // Menyesuaikan resolusi kanvas dengan ukuran tampilan & devicePixelRatio
        // agar roda tetap tajam, termasuk saat masuk mode layar penuh.
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            const displaySize = Math.round(rect.width || rect.height || 500);
            const backingSize = Math.max(displaySize, 300) * dpr;

            if (canvas.width !== backingSize || canvas.height !== backingSize) {
                canvas.width = backingSize;
                canvas.height = backingSize;
            }
            drawWheel();
        }

        function drawWheel() {
            const width = canvas.width;
            const height = canvas.height;
            const radius = width / 2;
            const center = radius;
            const sliceAngle = (2 * Math.PI) / currentNames.length;

            ctx.clearRect(0, 0, width, height);

            // Ukuran font menyesuaikan jumlah nama & ukuran roda agar tidak tumpang tindih
            const baseFontSize = Math.max(10, Math.min(radius * 0.075, (radius * 0.9 * sliceAngle) / 1.1));
            const textRadius = radius - Math.max(28, radius * 0.09);
            const maxChars = Math.max(3, Math.floor((textRadius - 20) / (baseFontSize * 0.56)));

            currentNames.forEach((name, index) => {
                const startAngle = currentAngle + index * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius - 10, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = wheelColors[index % wheelColors.length];
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();

                const displayName = name.length > maxChars ? name.slice(0, maxChars - 1) + '…' : name;

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${baseFontSize}px Inter, sans-serif`;
                ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
                ctx.shadowBlur = 4;
                ctx.fillText(displayName, textRadius, 0);
                ctx.restore();
            });

            ctx.beginPath();
            ctx.arc(center, center, radius * 0.084, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = Math.max(2, radius * 0.008);
            ctx.strokeStyle = '#4f46e5';
            ctx.stroke();
        }

        function startSpin(targetGroup) {
            if (isSpinning) return;

            if (isListEmpty()) {
                toast('Isi dulu daftar nama sebelum memutar roda.');
                return;
            }

            const allowedGroup = targetGroup === 'top' ? topGroupNames : bottomGroupNames;
            if (allowedGroup.length === 0) {
                const groupLabel = targetGroup === 'top' ? 'atas' : 'bawah';
                toast(`Kelompok ${groupLabel} masih kosong. Tambahkan nama dulu.`);
                return;
            }

            // Tentukan pemenang SEBELUM animasi dimulai, lalu hitung sudut akhir
            // yang tepat agar roda mendarat persis di nama tersebut — tidak ada
            // lagi "loncatan" hasil koreksi setelah roda berhenti.
            const winner = allowedGroup[Math.floor(Math.random() * allowedGroup.length)];
            const winIndex = currentNames.indexOf(winner);

            isSpinning = true;
            lastWinner = winner;
            if (wheelWrapper) wheelWrapper.classList.add('is-spinning');

            const spinDuration = settings.duration * 1000;
            const sliceAngle = (2 * Math.PI) / currentNames.length;

            // Titik pendaratan acak di dalam 60% bagian tengah slice (menghindari tepi/garis batas)
            const offsetInSlice = sliceAngle * (0.2 + Math.random() * 0.6);
            const desiredMod = mod(-(winIndex * sliceAngle) - offsetInSlice, 2 * Math.PI);
            const currentMod = mod(currentAngle, 2 * Math.PI);
            const deltaToTarget = mod(desiredMod - currentMod, 2 * Math.PI);
            const totalRotation = deltaToTarget + settings.rotations * 2 * Math.PI;

            const startTimestamp = performance.now();
            const initialAngle = currentAngle;
            let lastSliceIndex = -1;

            function animateSpin(currentTime) {
                const elapsed = currentTime - startTimestamp;
                const progress = Math.min(elapsed / spinDuration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                currentAngle = initialAngle + (totalRotation * easeOut);
                
                const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
                const currentSliceIndex = Math.floor(normalizedAngle / sliceAngle);
                
                if (currentSliceIndex !== lastSliceIndex) {
                    playTickSound();
                    lastSliceIndex = currentSliceIndex;
                }

                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    isSpinning = false;
                    if (wheelWrapper) wheelWrapper.classList.remove('is-spinning');
                    showWinnerModal(lastWinner);
                }
            }

            requestAnimationFrame(animateSpin);
        }

        const winnerModal = document.getElementById('winner-modal');
        const winnerModalContent = document.getElementById('winner-modal-content');
        const winnerNameDisplay = document.getElementById('winner-name-display');
        const removeWinnerBtn = document.getElementById('remove-winner-btn');
        const keepWinnerBtn = document.getElementById('keep-winner-btn');

        function showWinnerModal(name) {
            playWinSound();
            winnerNameDisplay.innerText = name;
            winnerModal.classList.remove('opacity-0', 'pointer-events-none');
            winnerModalContent.classList.remove('scale-90');
            winnerModalContent.classList.add('scale-100');
        }

        function closeModal() {
            winnerModal.classList.add('opacity-0', 'pointer-events-none');
            winnerModalContent.classList.remove('scale-100');
            winnerModalContent.classList.add('scale-90');
        }

        removeWinnerBtn.addEventListener('click', () => {
            topGroupNames = topGroupNames.filter(n => n !== lastWinner);
            bottomGroupNames = bottomGroupNames.filter(n => n !== lastWinner);
            syncTextareaFromArrays();
            parseNamesInput();
            closeModal();
        });

        keepWinnerBtn.addEventListener('click', () => {
            closeModal();
        });

        function syncTextareaFromArrays() {
            let lines = [...topGroupNames];
            if (bottomGroupNames.length > 0) {
                bottomGroupNames.forEach((n, idx) => {
                    if (idx === 0) {
                        lines.push(" " + n); // Mengembalikan tanda spasi sebagai kode pembatas
                    } else {
                        lines.push(n);
                    }
                });
            }
            namesInput.value = lines.join('\n');
        }

        // Klik pada area roda dalam atau tombol tengah memicu undian Kelompok Atas
        canvas.addEventListener('click', (e) => {
            e.stopPropagation();
            startSpin('top');
        });

        centerSpinBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startSpin('top');
        });

        // Klik pada area luar putih memicu undian Kelompok Bawah
        outerWheelContainer.addEventListener('click', (e) => {
            if (e.target === canvas || canvas.contains(e.target) || e.target === fullscreenBtn || fullscreenBtn.contains(e.target)) return;
            startSpin('bottom');
        });

        document.getElementById('save-names-btn').addEventListener('click', () => {
            parseNamesInput();
        });

        document.getElementById('shuffle-btn').addEventListener('click', () => {
            parseNamesInput();
            topGroupNames.sort(() => Math.random() - 0.5);
            bottomGroupNames.sort(() => Math.random() - 0.5);
            syncTextareaFromArrays();
            updateWheelData();
        });

        document.getElementById('sort-btn').addEventListener('click', () => {
            parseNamesInput();
            topGroupNames.sort();
            bottomGroupNames.sort();
            syncTextareaFromArrays();
            updateWheelData();
        });

        let fallbackFullscreen = false;

        fullscreenBtn.addEventListener('click', () => {
            const isActive = !!document.fullscreenElement || fallbackFullscreen;

            if (!isActive) {
                // Fullscreen-kan seluruh dokumen (bukan hanya kontainer roda) agar
                // modal nama pemenang & pengaturan tetap tampil di atas roda.
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().then(() => {
                        outerWheelContainer.classList.add('fullscreen-mode');
                        setTimeout(resizeCanvas, 60);
                    }).catch(() => {
                        fallbackFullscreen = true;
                        outerWheelContainer.classList.add('fullscreen-mode');
                        setTimeout(resizeCanvas, 60);
                    });
                } else {
                    fallbackFullscreen = true;
                    outerWheelContainer.classList.add('fullscreen-mode');
                    setTimeout(resizeCanvas, 60);
                }
            } else {
                if (document.fullscreenElement && document.exitFullscreen) {
                    document.exitFullscreen();
                } else {
                    fallbackFullscreen = false;
                    outerWheelContainer.classList.remove('fullscreen-mode');
                    setTimeout(resizeCanvas, 60);
                }
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && !fallbackFullscreen) {
                outerWheelContainer.classList.remove('fullscreen-mode');
            }
            setTimeout(resizeCanvas, 60);
        });

        let resizeDebounce = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeDebounce);
            resizeDebounce = setTimeout(resizeCanvas, 120);
        });

        const settingsModal = document.getElementById('settings-modal');
        const settingsModalContent = document.getElementById('settings-modal-content');
        const settingsToggleBtn = document.getElementById('settings-toggle-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const spinDurationSelect = document.getElementById('spin-duration-select');
        const spinSpeedSelect = document.getElementById('spin-speed-select');

        settingsToggleBtn.addEventListener('click', () => {
            settingsModal.classList.remove('opacity-0', 'pointer-events-none');
            settingsModalContent.classList.remove('scale-90');
            settingsModalContent.classList.add('scale-100');
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
            settingsModalContent.classList.remove('scale-100');
            settingsModalContent.classList.add('scale-90');
        });

        saveSettingsBtn.addEventListener('click', () => {
            settings.duration = parseInt(spinDurationSelect.value);
            
            const speedChoice = spinSpeedSelect.value;
            if (speedChoice === 'lambat') settings.rotations = 2;
            else if (speedChoice === 'sedang') settings.rotations = 6;
            else if (speedChoice === 'cepat') settings.rotations = 12;
            else settings.rotations = parseInt(speedChoice);

            settingsModal.classList.add('opacity-0', 'pointer-events-none');
            settingsModalContent.classList.remove('scale-100');
            settingsModalContent.classList.add('scale-90');
        });

        window.onload = () => {
            namesInput.value = "Ali\nBeatriz\nCharles\n Diya\nEric\nFatimah";
            parseNamesInput();
        };
    </script>
</body>
</html>
